name: Build and Auto-Sign APK (Bundled Models)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5 # ✅ Updated to v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # ✅ Updated to v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Large AI Models and Bundle into Assets
        run: |
          mkdir -p app/src/main/assets
          
          echo "Downloading Piper TTS model..."
          curl -L -o app/src/main/assets/en_US-ljspeech-medium.onnx \
            https://github.com/vishala5000/AutoCapVideo/releases/download/ljspeech/en_US-ljspeech-medium.onnx
          
          echo "Downloading Piper TTS config..."
          curl -L -o app/src/main/assets/en_US-ljspeech-medium.onnx.json \
            https://github.com/vishala5000/AutoCapVideo/releases/download/ljspeech/en_US-ljspeech-medium.onnx.json
          
          echo "Downloading Whisper Tiny model..."
          curl -L -o app/src/main/assets/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          
          echo "All models downloaded successfully!"
          ls -lh app/src/main/assets/

      - name: Generate Temporary Keystore On-The-Fly
        run: |
          keytool -genkey -v \
            -keystore app/temp_release.keystore \
            -alias my_temp_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temp1234 \
            -keypass temp1234 \
            -dname "CN=AutoCapVideo, OU=Personal, O=YouTube, L=City, S=State, C=US"
          
          echo "KEYSTORE_PATH=temp_release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=temp1234" >> $GITHUB_ENV
          echo "KEY_ALIAS=my_temp_key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=temp1234" >> $GITHUB_ENV

      - name: Fix Gradle Wrapper Permissions
        run: |
          [ -d "gradlew" ] && rm -rf gradlew
          chmod +x gradlew

      - name: Build and Auto-Sign Release APK
        env:
          GRADLE_OPTS: "-Xmx4g"
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4 # v4 is still the latest stable for artifacts
        with:
          name: AutoCapVideo-Fully-Offline-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
