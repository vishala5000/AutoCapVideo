name: Build and Auto-Sign APK (No Secrets)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Temporary Keystore On-The-Fly
        run: |
          keytool -genkey -v \
            -keystore temp_release.keystore \
            -alias my_temp_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temp1234 \
            -keypass temp1234 \
            -dname "CN=AutoCapVideo, OU=Personal, O=YouTube, L=City, S=State, C=US"
          
          echo "KEYSTORE_PATH=temp_release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=temp1234" >> $GITHUB_ENV
          echo "KEY_ALIAS=my_temp_key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=temp1234" >> $GITHUB_ENV

      - name: Fix Gradle Wrapper Permissions
        run: |
          [ -d "gradlew" ] && rm -rf gradlew
          chmod +x gradlew

      - name: Build and Auto-Sign Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCapVideo-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
