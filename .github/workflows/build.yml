name: Build and Auto-Sign APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Temporary Keystore
        run: |
          keytool -genkey -v -keystore temp_release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass temp1234 -keypass temp1234 -dname "CN=AutoCapVideo, OU=Dev, O=AutoCap, L=City, S=State, C=US"
          echo "KEYSTORE_PATH=temp_release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=temp1234" >> $GITHUB_ENV
          echo "KEY_ALIAS=mykey" >> $GITHUB_ENV
          echo "KEY_PASSWORD=temp1234" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCapVideo-Release
          path: app/build/outputs/apk/release/app-release.apk
